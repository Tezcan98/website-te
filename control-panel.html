<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sulama Kumandası - Kontrol Paneli</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: linear-gradient(135deg, #6BBF59 0%, #4CAF50 50%, #66BB6A 100%); 
            min-height: 100vh; 
            color: white; 
        }
        .header { text-align: center; padding: 20px; position: relative; }
        .device-name { font-size: 2rem; font-weight: 300; letter-spacing: 2px; margin-bottom: 10px; }

        .main-circle { 
            width: 250px; 
            height: 250px; 
            margin: 30px auto; 
            border: 3px solid rgba(255, 255, 255, 0.5); 
            border-radius: 50%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(10px); 
        }
        .status-text { font-size: 1.2rem; font-weight: 300; opacity: 0.9; margin-bottom: 10px; }
        .timer-display { 
            font-size: 1.5rem; 
            font-weight: 600; 
            margin-top: 10px; 
            font-family: monospace;
        }
        .play-btn { 
            position: absolute; 
            bottom: -30px; 
            width: 60px; 
            height: 60px; 
            background: white; 
            border: none; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); 
            transition: all 0.3s ease; 
        }
        .play-btn:hover { transform: scale(1.1); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4); }
        .play-icon { 
            width: 0; 
            height: 0; 
            border-left: 15px solid #4CAF50; 
            border-top: 10px solid transparent; 
            border-bottom: 10px solid transparent; 
            margin-left: 3px; 
        }
        .stop-icon { 
            width: 16px; 
            height: 16px; 
            background: #e74c3c; 
            border-radius: 2px; 
        }
        .controls-section { 
            background: rgba(255, 255, 255, 0.95); 
            color: #333; 
            border-radius: 20px 20px 0 0; 
            margin-top: 50px; 
            padding: 30px 20px; 
            min-height: 400px; 
        }
        .control-title { 
            font-size: 1.3rem; 
            font-weight: 600; 
            margin-bottom: 20px; 
            color: #333; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .control-grid { display: grid; gap: 15px; margin-bottom: 30px; }
        .control-card { 
            background: #f8f9fa; 
            border-radius: 12px; 
            padding: 20px; 
            border: 1px solid #e9ecef; 
            transition: all 0.3s ease; 
        }
        .control-card:hover { background: #e8f5e8; border-color: #4CAF50; }
        .card-title { 
            font-size: 1.1rem; 
            font-weight: 600; 
            margin-bottom: 15px; 
            color: #333; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        .control-btn { 
            width: 100%; 
            padding: 12px; 
            border: none; 
            border-radius: 8px; 
            font-size: 1rem; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.3s ease; 
        }
        .btn-primary { background: #4CAF50; color: white; }
        .btn-primary:hover { background: #45a049; }
        .btn-warning { background: #ff9800; color: white; }
        .btn-warning:hover { background: #e68900; }
        .btn-danger { background: #f44336; color: white; }
        .btn-danger:hover { background: #da190b; }
        .btn-info { background: #2196F3; color: white; }
        .btn-info:hover { background: #0b7dda; }
        .timer-input { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ddd; 
            border-radius: 6px; 
            margin-bottom: 10px; 
            font-size: 1rem; 
            text-align: center; 
        }
        .timer-input:focus { outline: none; border-color: #4CAF50; }
        .mqtt-status { 
            position: fixed; 
            bottom: 20px; 
            left: 20px; 
            right: 20px; 
            background: rgba(0, 0, 0, 0.8); 
            color: white; 
            padding: 10px 15px; 
            border-radius: 25px; 
            text-align: center; 
            font-size: 0.9rem; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            z-index: 1000;
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; animation: pulse 2s infinite; }
        .connected { background: #4CAF50; }
        .disconnected { background: #f44336; }
        .connecting { background: #ff9800; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .loading-spinner {
            width: 50px; height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="header">
        <div class="device-name" id="deviceName">CİHAZ KODU</div>
    </div>
    
    <div class="main-circle">
        <div class="status-text" id="statusText">Durum Sorgulanıyor...</div>
        <div class="timer-display" id="timerDisplay">00:00:00</div>
        <button class="play-btn" id="playBtn" onclick="toggleOperation()">
            <div class="play-icon" id="playIcon"></div>
        </button>
    </div>

    <div class="controls-section">
        <div class="control-title">⚙️ Sulama Kontrolleri</div>
        <div class="control-grid">
            <div class="control-card">
                <div class="card-title">🔄 Durum Sorgula</div>
                <button class="control-btn btn-info" onclick="queryDeviceStatus(true)">Durumu Yenile</button>
            </div>
            <div class="control-card">
                <div class="card-title">▶️ Süresiz Çalışma</div>
                <button class="control-btn btn-primary" onclick="startInfiniteRun()">Başlat</button>
            </div>
            <div class="control-card">
                <div class="card-title">⏱️ Süreli Çalışma</div>
                <input type="number" class="timer-input" id="timerHours" placeholder="Saat (1-72)" min="1" max="72" step="1">
                <button class="control-btn btn-warning" onclick="startTimedRun()">Zamanlı Başlat</button>
            </div>
            <div class="control-card">
                <div class="card-title">⏹️ Durdur</div>
                <button class="control-btn btn-danger" onclick="stopDevice()">Sulama Durdur</button>
            </div>
        </div>
    </div>
    
    <div class="mqtt-status" id="mqttStatus">
        <div class="status-dot disconnected"></div>
        <span>Bağlantı kuruluyor...</span>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <script>
        // ===== PROTOKOL TANIMLARI =====
        const MESSAGE_PROTOCOL = { 
            STATUS: 0, 
            RUN: 1, 
            STOP: 2, 
            TIMER_RUN: 3 
        };
        
        const StatusEnum = { 
            UNKNOWN: 0, 
            READY: 1, 
            RUNNING: 2, 
            TIME_RUNNING: 3, 
            FAULT: 4 
        };

        const commandTopic = "emir/";
        const ackTopic = "cevap/";

        // ===== DEĞİŞKENLER =====
        let currentDeviceCode = '';
        let isRunning = false;
        let isConnected = false;
        let timerInterval = null;
        let timerSeconds = 0;
        let currentStatus = StatusEnum.UNKNOWN;
        let pollInterval = null;
        let eventSource = null;

        // ===== SAYFA YÜKLENDİĞİNDE =====
        window.addEventListener('load', function() {
            const urlParams = new URLSearchParams(window.location.search);
            currentDeviceCode = urlParams.get('device') || 'UNKNOWN';
            document.getElementById('deviceName').textContent = currentDeviceCode;
            
            // Bildirim izni iste
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
            
            // Sunucuya bağlantı kontrol et
            checkServerConnection();
            
            // SSE ile anlık bildirim dinle
            connectSSE();
            
            // 10 saniyede bir durum sorgula (arka planda yapma)
            pollInterval = setInterval(function() {
                if (!document.hidden) queryDeviceStatus(true);
            }, 10000);
        });

        // ===== BİLDİRİM GÖNDER =====
        function sendNotification(title, body) {
    try {
        if ('Notification' in window && Notification.permission === 'granted') {
            new Notification(title, { body: body, icon: '/favicon.ico' });
        }
    } catch (e) {
        // Android Chrome new Notification()'a izin vermez; sessiz geç
        console.warn('Bildirim gösterilemedi:', e.message);
    }
}

        // ===== SSE BAĞLANTISI (Anlık bildirim) =====
        function connectSSE() {
            if (eventSource) eventSource.close();
            
            eventSource = new EventSource('/api/events');
            
            eventSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'status' && data.device === currentDeviceCode) {
                        const prevStatus = currentStatus;
                        handleStatusData(data.data);
                        
                        // Durum değiştiyse ve sayfa arka plandaysa bildirim gönder
                        if (prevStatus !== data.data.status && document.hidden) {
                            const statusMap = {0:'Bilinmiyor',1:'Hazır',2:'Çalışıyor',3:'Süreli Çalışıyor',4:'Arızalı'};
                            const newStatusStr = statusMap[data.data.status] || 'Bilinmiyor';
                            if (data.data.status === 1) {
                                sendNotification('Sulama Tamamlandı', currentDeviceCode + ' cihazı durdu: ' + newStatusStr);
                            } else if (data.data.status === 2 || data.data.status === 3) {
                                sendNotification('Sulama Başladı', currentDeviceCode + ' cihazı: ' + newStatusStr);
                            } else if (data.data.status === 4) {
                                sendNotification('Arıza!', currentDeviceCode + ' cihazında arıza var!');
                            } else {
                                sendNotification('Sulama Durumu', currentDeviceCode + ': ' + newStatusStr);
                            }
                        }
                    }
                } catch(e) {}
            };
            
            eventSource.onerror = function() {
                setTimeout(connectSSE, 5000);
            };
        }

        // ===== SUNUCU BAĞLANTISI =====
        function checkServerConnection() {
            updateMqttStatus('Sunucuya bağlanılıyor...', 'connecting');
            
            fetch('/api/ping')
                .then(r => r.text())
                .then(text => {
                    console.log('Sunucu bağlantısı var:', text);
                    isConnected = true;
                    updateMqttStatus('Bağlandı - Hazır', 'connected');
                    queryDeviceStatus(true); // sayfa yüklenince STATUS gönder
                    hideLoading();
                })
                .catch(err => {
                    console.error('Sunucu bağlantı hatası:', err);
                    isConnected = false;
                    updateMqttStatus('Sunucuya bağlanılamadı!', 'disconnected');
                    hideLoading();
                });
        }

        // ===== MQTT KOMUT GÖNDERME (HTTP üzerinden) =====
        function sendMqttCommand(cmd, deviceCode) {
            return new Promise((resolve, reject) => {
                const device = deviceCode || currentDeviceCode;
                
                fetch('/api/mqtt-send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        topic: commandTopic + device,
                        message: cmd.toString()
                    })
                })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        resolve(data);
                    } else {
                        reject(new Error(data.error || 'Bilinmeyen hata'));
                    }
                })
                .catch(err => reject(err));
            });
        }

        // ===== MQTT DURUM SORGULAMA =====
        // sendMqtt=true: STATUS komutu gönder (buton/sayfa yüklenirken)
        // sendMqtt=false: sadece cache'den oku (otomatik poll)
        function queryDeviceStatus(sendMqtt) {
            if (sendMqtt) {
                // STATUS (0) komutunu MQTT broker'a gönder, cihaz anlık durumunu yayınlasın
                fetch('/api/mqtt-send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        topic: commandTopic + currentDeviceCode,
                        message: MESSAGE_PROTOCOL.STATUS.toString()
                    })
                }).catch(() => {});
            }
            
            // Cevap gelmesi için 300ms bekle, sonra cache'den oku
            setTimeout(() => {
                fetch('/api/mqtt-query?device=' + encodeURIComponent(currentDeviceCode))
                    .then(r => r.json())
                    .then(data => {
                        if (data.success && data.status !== undefined) {
                            handleStatusData(data);
                        }
                    })
                    .catch(err => {});
            }, sendMqtt ? 300 : 0);
        }

        function startInfiniteRun() {
            if (!isConnected) {
                showToast('Sunucuya bağlantı yok!', 'error');
                return;
            }
            sendMqttCommand(MESSAGE_PROTOCOL.RUN)
                .then(() => {
                    showToast('Sulama başlatıldı');
                    setTimeout(() => queryDeviceStatus(true), 1500);
                })
                .catch(err => showToast('Hata: ' + err.message, 'error'));
        }

        function startTimedRun() {
            if (!isConnected) {
                showToast('Sunucuya bağlantı yok!', 'error');
                return;
            }
            const hoursInput = document.getElementById('timerHours').value;
            const hours = parseFloat(hoursInput);

            if (!hours || hours <= 0) {
                showToast('Lütfen geçerli bir saat değeri girin!', 'error');
                return;
            }

            const totalSeconds = Math.round(parseFloat(hours) * 3600);
            if (totalSeconds < 60 || totalSeconds > 259200) {
                showToast('Lütfen 1 - 72 saat arası bir değer girin!', 'error');
                return;
            }

            const cmd = MESSAGE_PROTOCOL.TIMER_RUN + "/" + totalSeconds;
            sendMqttCommand(cmd)
                .then(() => {
                    showToast('Süreli sulama başlatıldı');
                    setTimeout(() => queryDeviceStatus(true), 1500);
                })
                .catch(err => showToast('Hata: ' + err.message, 'error'));
        }

        function stopDevice() {
            if (!isConnected) {
                showToast('Sunucuya bağlantı yok!', 'error');
                return;
            }
            if (!confirm('Sulama işlemini durdurmak istediğinize emin misiniz?')) return;

            sendMqttCommand(MESSAGE_PROTOCOL.STOP)
                .then(() => {
                    showToast('Sulama durduruldu');
                    setTimeout(() => queryDeviceStatus(true), 1500);
                })
                .catch(err => showToast('Hata: ' + err.message, 'error'));
        }

        function toggleOperation() {
            if (currentStatus === StatusEnum.RUNNING || currentStatus === StatusEnum.TIME_RUNNING) {
                if (confirm('Sulama çalışıyor. Durdurmak istediğinize emin misiniz?')) {
                    stopDevice();
                }
            } else {
                startInfiniteRun();
            }
        }
	function formatTime(seconds) {
	    const h = Math.floor(seconds / 3600);
	    const m = Math.floor((seconds % 3600) / 60);
	    const s = seconds % 60;
	    if (h > 0) {
		return h + 's ' + String(m).padStart(2,'0') + 'd ' + String(s).padStart(2,'0') + 'sn';
	    }
	    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
	}
        // ===== STATUS VERİSİ İŞLEME =====
        function handleStatusData(data) {
            const status = parseInt(data.status);
            const serverTimerValue = parseInt(data.timerValue) || 0;

            currentStatus = status;
	if (status === StatusEnum.FAULT) {
    updateDeviceStatus(status);   // önce ekranı güncelle
    stopLocalTimer();
    timerSeconds = 0;
    updateTimerDisplay();
    sendNotification('⚠️ Arıza!', currentDeviceCode + ' cihazında arıza tespit edildi!');
    return;
}
            const isLocalTimerActive = timerInterval !== null;
            if (!isLocalTimerActive || Math.abs(serverTimerValue - timerSeconds) > 5) {
                timerSeconds = serverTimerValue;
            }

            updateDeviceStatus(status);

            if (status === StatusEnum.RUNNING || status === StatusEnum.TIME_RUNNING) {
                if (!isLocalTimerActive) startLocalTimer();
            } 
            else {
                stopLocalTimer();
                 if (status === StatusEnum.FAULT || status === StatusEnum.READY) {
			timerSeconds = 0;
			updateTimerDisplay();
		 }
            }
        }

       function updateDeviceStatus(status) {
	    const statusTextMap = {
		0: 'Bilinmeyen',
		1: 'Hazır',
		2: 'Çalışıyor',
		3: 'Süreli Çalışıyor',
		4: 'ARIZA!'
	    };
	    
	    let statusText = statusTextMap[status] || 'Bilinmeyen';
	    document.getElementById('statusText').textContent = statusText;
	    updateTimerDisplay();
	    
	    // --- GÖRSEL GÜNCELLEME (ARIZA İÇİN) ---
	    const mainCircle = document.querySelector('.main-circle');
	    if (status === StatusEnum.FAULT) {
		mainCircle.style.borderColor = '#f44336'; // Kırmızı çerçeve
		mainCircle.style.background = 'rgba(244, 67, 54, 0.1)'; // Hafif kırmızı arka plan
		document.getElementById('statusText').style.color = '#f44336';
	    } else {
		mainCircle.style.borderColor = ''; // Varsayılana dön
		mainCircle.style.background = '';
		document.getElementById('statusText').style.color = '';
	    }
	    // -------------------------------------
	    
	    isRunning = (status === StatusEnum.RUNNING || status === StatusEnum.TIME_RUNNING);
	    updatePlayButton(isRunning);
	}
        function updatePlayButton(running) {
            const playBtn = document.getElementById('playBtn');
            const playIcon = document.getElementById('playIcon');
            
            if (running) {
                playIcon.className = 'stop-icon';
                playBtn.style.background = '#f44336';
            } else {
                playIcon.className = 'play-icon';
                playBtn.style.background = 'white';
            }
        }

        // ===== LOKAL ZAMANLAYICI =====
        function startLocalTimer() {
            stopLocalTimer();
            
            timerInterval = setInterval(() => {
                if (currentStatus === StatusEnum.TIME_RUNNING) {
                    timerSeconds = Math.max(0, timerSeconds - 1);
                    if (timerSeconds <= 0) {
                        stopLocalTimer();
                        currentStatus = StatusEnum.READY;
                        updateDeviceStatus(StatusEnum.READY, 0);
                        showToast('Süreli sulama tamamlandı');
                        return;
                    }
                } else if (currentStatus === StatusEnum.RUNNING) {
                    timerSeconds++;
                } else {
                    return;
                }
                updateTimerDisplay();
            }, 1000);
        }

        function stopLocalTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function updateTimerDisplay() {
            const hours = Math.floor(timerSeconds / 3600);
            const minutes = Math.floor((timerSeconds % 3600) / 60);
            const seconds = timerSeconds % 60;
            
            const display = 
                String(hours).padStart(2, '0') + ':' +
                String(minutes).padStart(2, '0') + ':' +
                String(seconds).padStart(2, '0');
            
            document.getElementById('timerDisplay').textContent = display;
        }

        // ===== YARDIMCI FONKSİYONLAR =====
        function updateMqttStatus(msg, type) {
            const el = document.getElementById('mqttStatus');
            el.querySelector('span').textContent = msg;
            el.querySelector('.status-dot').className = `status-dot ${type}`;
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: ${type === 'error' ? '#f44336' : '#4CAF50'};
                color: white;
                padding: 12px 24px;
                border-radius: 8px;
                z-index: 3000;
                animation: fadeIn 0.3s;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        function hideLoading() {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) {
                overlay.style.display = 'none';
            }
        }

        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
                to { opacity: 1; transform: translateX(-50%) translateY(0); }
            }
            @keyframes fadeOut {
                from { opacity: 1; }
                to { opacity: 0; }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
