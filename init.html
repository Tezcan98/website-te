<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BI Analytics Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 60px 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            animation: slideUp 0.6s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(45deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 32px;
            color: white;
            font-weight: bold;
        }
        
        h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 15px;
            font-weight: 700;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 40px;
            line-height: 1.5;
        }
        
        .platform-selection {
            margin-bottom: 30px;
        }
        
        .platform-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .platform-btn {
            background: white;
            border: 2px solid #e0e6ed;
            border-radius: 15px;
            padding: 25px 35px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            min-width: 160px;
            position: relative;
            overflow: hidden;
        }
        
        .platform-btn:hover {
            transform: translateY(-5px);
            border-color: #4facfe;
            box-shadow: 0 10px 30px rgba(79, 172, 254, 0.3);
        }
        
        .platform-btn.selected {
            background: linear-gradient(45deg, #4facfe 0%, #00f2fe 100%);
            border-color: #4facfe;
            color: white;
        }
        
        .platform-icon {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border-radius: 10px;
            background: rgba(79, 172, 254, 0.1);
            transition: all 0.3s ease;
        }
        
        .platform-btn.selected .platform-icon {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .platform-name {
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .continue-btn {
            background: linear-gradient(45deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0.5;
            pointer-events: none;
            margin-top: 20px;
        }
        
        .continue-btn.active {
            opacity: 1;
            pointer-events: auto;
        }
        
        .continue-btn:hover.active {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.4);
        }
        
        .features {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #e0e6ed;
        }
        
        .feature-list {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            font-size: 0.9rem;
        }
        
        .feature-icon {
            color: #4facfe;
            font-weight: bold;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 40px 30px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .platform-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .platform-btn {
                width: 100%;
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">💧</div>
        <h1>Sulama Kumandası</h1>
        <p class="subtitle">Sulama sistemlerinizi uzaktan kontrol edin</p>
        
        <div class="platform-selection">
            <div class="platform-buttons">
                <div class="platform-btn" data-platform="android">
                    <div class="platform-icon">🤖</div>
                    <div class="platform-name">Android</div>
                </div>
                
                <div class="platform-btn" data-platform="ios">
                    <div class="platform-icon">🌐</div>
                    <div class="platform-name">iOS / Windows</div>
                </div>
            </div>
        </div>
        
        <button class="continue-btn" id="continueBtn">Devam Et</button>
        
        <div class="features">
            <div class="feature-list">
                <div class="feature-item">
                    <span class="feature-icon">💧</span>
                    <span>Uzaktan Sulama</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">⏱️</span>
                    <span>Zamanlı Kontrol</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">📱</span>
                    <span>MQTT Kontrol</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedPlatform = null;
        const platformBtns = document.querySelectorAll('.platform-btn');
        const continueBtn = document.getElementById('continueBtn');
        
        platformBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Tüm seçimleri temizle
                platformBtns.forEach(b => b.classList.remove('selected'));
                
                // Seçilen platform'u işaretle
                btn.classList.add('selected');
                selectedPlatform = btn.dataset.platform;
                
                // Devam butonunu aktif et
                continueBtn.classList.add('active');
            });
        });
        
        continueBtn.addEventListener('click', () => {
            if (selectedPlatform === 'android') {
                // Android APK indirme
                handleAndroidDownload();
            } else if (selectedPlatform === 'ios') {
                // iOS web sitesine yönlendirme
                handleIOSRedirect();
            }
        });
        
       function handleAndroidDownload() {
	  const downloadLink = document.createElement('a');
	  downloadLink.href = 'sulama.apk'; // public klasöründe durmalı
	  downloadLink.download = 'sulama.apk';

	  document.body.appendChild(downloadLink);
	  downloadLink.click();
	  document.body.removeChild(downloadLink);

	  alert('APK dosyası indiriliyor...\n\nDikkat: Bilinmeyen kaynaklardan uygulama yüklemesine izin vermeniz gerekebilir.');
	  console.log('APK indirme işlemi başlatıldı...');
	}
        function handleIOSRedirect() { 
            // Cihaz kodu giriş sayfasına yönlendirme
            window.location.href = 'ios.html';
        }
        
        // Klavye desteği
        document.addEventListener('keydown', (e) => {
            if (e.key === '1') {
                document.querySelector('[data-platform="android"]').click();
            } else if (e.key === '2') {
                document.querySelector('[data-platform="ios"]').click();
            } else if (e.key === 'Enter' && selectedPlatform) {
                continueBtn.click();
            }
        });
    </script>
</body>
</html>
